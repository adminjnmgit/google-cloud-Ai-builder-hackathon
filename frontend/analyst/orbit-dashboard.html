<script>
/*
 * Orbit Quant Engine: event to EBITDA, with scenario bands, materiality, calibrated confidence and a decision layer.
 * Runs in Node (tests, CLI) and in the browser (window.OrbitQuant). No dependencies.
 *
 * Pipeline per (event, company):
 *   verify sources -> map channels (first order, plus second order through event links) -> shock distribution
 *   -> Monte Carlo transmission -> scenario bands -> materiality -> confidence (components, isotonic calibration)
 *   -> levers and decision -> audit trace
 *
 * Units: EBITDA impact is in percent of EBITDA. Variable moves are in the event's unit (%, bps or pts).
 * A channel's beta is the median EBITDA % change per 1 unit of the variable (per 100 bps for rate-type variables)
 * before pass-through, hedge and substitution. sigmaC is the lognormal uncertainty on beta.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(); else root.OrbitQuant = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ------------------------------------------------------------------ numerics
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function gaussians(rng, n) { const out = new Float64Array(n); for (let i = 0; i < n; i += 2) { let u = 0, v = 0; while (u === 0) u = rng(); while (v === 0) v = rng(); const r = Math.sqrt(-2 * Math.log(u)), t = 2 * Math.PI * v; out[i] = r * Math.cos(t); if (i + 1 < n) out[i + 1] = r * Math.sin(t); } return out; }
  // Acklam's inverse normal CDF
  function qnorm(p) { const a = [-3.969683028665376e+01, 2.209460984245205e+02, -2.759285104469687e+02, 1.383577518672690e+02, -3.066479806614716e+01, 2.506628277459239e+00], b = [-5.447609879822406e+01, 1.615858368580409e+02, -1.556989798598866e+02, 6.680131188771972e+01, -1.328068155288572e+01], c = [-7.784894002430293e-03, -3.223964580411365e-01, -2.400758277161838e+00, -2.549732539343734e+00, 4.374664141464968e+00, 2.938163982698783e+00], d = [7.784695709041462e-03, 3.224671290700398e-01, 2.445134137142996e+00, 3.754408661907416e+00]; const pl = 0.02425, ph = 1 - pl; let q, r; if (p < pl) { q = Math.sqrt(-2 * Math.log(p)); return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); } if (p <= ph) { q = p - 0.5; r = q * q; return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4]) * r + a[5]) * q / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4]) * r + 1); } q = Math.sqrt(-2 * Math.log(1 - p)); return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1); }
  function quantile(sorted, p) { const i = (sorted.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i); return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo); }
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const r1 = x => Math.round(x * 10) / 10, r2 = x => Math.round(x * 100) / 100, r3 = x => Math.round(x * 1000) / 1000;

  // Pool-adjacent-violators isotonic regression: returns a monotone step map raw -> calibrated
  function isotonic(pairs) {
    const pts = pairs.slice().sort((a, b) => a[0] - b[0]);
    const blocks = pts.map(p => ({ sum: p[1], n: 1, lo: p[0], hi: p[0] }));
    let i = 0;
    while (i < blocks.length - 1) {
      if (blocks[i].sum / blocks[i].n > blocks[i + 1].sum / blocks[i + 1].n) {
        const m = { sum: blocks[i].sum + blocks[i + 1].sum, n: blocks[i].n + blocks[i + 1].n, lo: blocks[i].lo, hi: blocks[i + 1].hi };

  // Platt scaling: logistic fit of hit ~ a + b * logit(raw) by Newton's method. Smooth and monotone; used for the live score. Isotonic bins stay as the diagnostic.

    }

  }

  // ------------------------------------------------------------------ data: tags, events, companies
  const TAGS = ['Supply disruption', 'Commodity shock', 'Geopolitical event', 'Interest-rate change', 'Trade restriction', 'Regulation', 'Demand shock', 'Technology change'];

  // sigmaE: lognormal dispersion of the realised move around the stated magnitude. hit: precedent direction hit rate for this event type.
  const EVENTS = [
    { id: 'crude', title: 'Crude oil rises 10% following a supply disruption', keys: ['crude', 'oil', 'brent', 'supply'], tags: ['Supply disruption', 'Commodity shock', 'Geopolitical event'], date: '2026-10-03', horizonQ: 2, horizonText: '1 to 3 quarters',
      variable: { name: 'crude', label: 'Crude oil price', unit: '%', magnitude: 10 }, sigmaE: 0.25, hit: 0.70,
      precedents: [{ title: '2022 supply shock', sim: 0.82, outcome: 'Airline EBITDA fell 4 to 6%; upstream EBITDA rose 5 to 8%' }, { title: '2019 Abqaiq attack', sim: 0.66, outcome: 'Crude +15% for three weeks, then normalised' }],
      sources: [{ src: 'Exchange settlement (Brent)', cred: 0.99, type: 'FACT', claim: 'move' }, { src: 'Wire service', cred: 0.92, type: 'FACT', claim: 'outage' }, { src: 'OMC price notice', cred: 0.9, type: 'FACT', claim: 'retail' }, { src: 'Transport association', cred: 0.65, type: 'CLAIM', claim: 'freight' }, { src: 'Analyst note', cred: 0.6, type: 'PREDICTION', claim: 'polymer' }] },
    { id: 'rate', title: 'The policy rate rises by 50 basis points', keys: ['rate', 'repo', 'policy', 'interest', 'mpc'], tags: ['Interest-rate change'], date: '2026-10-09', horizonQ: 2, horizonText: '1 to 2 quarters',

  const norm = s => String(s || '').toLowerCase().trim();

  // ------------------------------------------------------------------ source verification
  function verify(ev) {

  // ------------------------------------------------------------------ channel mapping (first and second order)

  // Sign of the EBITDA effect when the variable rises: cost and treasury default to adverse (-1), revenue, finance and demand default to supportive (+1); a channel can override with signUp.
  const SIGN_UP = { cost: -1, treasury: -1, revenue: 1, finance: 1, demand: 1 };
  function channelSign(c) { const signUp = c.signUp !== undefined ? c.signUp : SIGN_UP[c.kind]; return (c.move.magnitude > 0 ? 1 : -1) * signUp; }
  function channelMedian(c, horizonQ) { const { T } = transmission(c, horizonQ); return channelSign(c) * c.beta * Math.abs(c.move.magnitude) * unitScale(c.move.unit) * T; }

  // ------------------------------------------------------------------ Monte Carlo transmission
  function simulate(ev, co, chans, opts) {
    const N = (opts && opts.draws) || 8000; const half = N / 2;

    const shockZ = {}; const total = new Float64Array(N); const perChannel = [];
    chans.forEach(c => {
      const key = c.move.name; if (!shockZ[key]) { const z = gaussians(rng, half); const full = new Float64Array(N); for (let i = 0; i < half; i++) { full[i] = z[i]; full[i + half] = -z[i]; } shockZ[key] = full; }
      const zb = gaussians(rng, half); const med = channelMedian(c, ev.horizonQ); const draws = new Float64Array(N);
      for (let i = 0; i < half; i++) { const m1 = Math.exp(c.sigmaE * shockZ[key][i]), m2 = Math.exp(c.sigmaE * shockZ[key][i + half]); const b1 = Math.exp(c.sigmaC * zb[i]), b2 = Math.exp(-c.sigmaC * zb[i]); draws[i] = med * m1 * b1; draws[i + half] = med * m2 * b2; }
      for (let i = 0; i < N; i++) total[i] += draws[i];

  function baseProbability(chans) { const c = chans.reduce((a, b) => Math.abs(channelMedian(b, 2)) > Math.abs(channelMedian(a, 2)) ? b : a); return { p: r2(clamp(0.55 + 0.5 * (c.hit - 0.70) - 0.30 * (c.policyRisk || 0), 0.30, 0.70)), primary: c }; }
  // Base case is the central pBase mass of the simulated distribution. The favourable tail (less loss or more gain) is the upside case, the other tail the downside case; policy risk weights the downside tail.
  function scenarios(sim, pBase, primary) {

  }
  const exposedCompanies = e => COMPANIES.filter(c => c.channels.some(h => h.variable === e.var));
  return { INDUSTRIES, CATEGORIES, VARS, COMPANIES, companyById, titleOf, tokenOf, exposedCompanies, fmtMag };

<script src="../shared/orbit-api.js"></script>
<script>
// The feed comes from the database through /api/data (bundled snapshot if the server is down).
OrbitAPI.ready(function () {
const DATA = window.ORBIT_DATA;
(function () {
  const Q = window.OrbitQuant, M = window.OrbitMVP; const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const CATS = M.CATEGORIES, INDS = M.INDUSTRIES; const CCOL = { 'Supply disruption': 'var(--c1)', 'Commodity shock': 'var(--c2)', 'Regulation': 'var(--c3)', 'Trade restriction': 'var(--c4)', 'Interest-rate change': 'var(--c5)', 'Geopolitical event': 'var(--c6)', 'Demand shock': 'var(--c7)' };
  const fmt = x => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(1) + '%'; const pct = x => Math.round(x * 100) + '%';
  const sgn = x => x < 0 ? 'neg' : x > 0 ? 'pos' : ''; const confColor = c => c >= 0.8 ? 'var(--good)' : c >= 0.65 ? 'var(--warn)' : 'var(--crit)';
  const d2 = s => { const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/); return m ? new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)) : new Date(NaN); }; const fmtD = d => d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }); const fmtDs = d => d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
  const E = DATA.events.map(e => ({ ...e, title: M.titleOf(e), firstD: d2(e.first), lastD: d2(e.last), primary: e.cats[0] })); const META = DATA.meta; const END = d2(META.last), START = d2(META.first);
  const T = { view: 'overview', window: 'all', inds: new Set(), cats: new Set(), q: '', sel: null, co: 'maruti', cache: new Map() };
  const windowStart = () => T.window === 'all' ? START : new Date(END.getTime() - Number(T.window) * 86400000);
  const inWindow = e => e.lastD >= windowStart();
  const filtered = () => E.filter(e => inWindow(e) && (!T.inds.size || e.inds.some(i => T.inds.has(i))) && (!T.cats.size || e.cats.some(c => T.cats.has(c))) && (!T.q || (e.title + ' ' + e.rep + ' ' + e.reports.map(r => r.headline).join(' ')).toLowerCase().includes(T.q.toLowerCase())));
  function assess(e, co, draws) { const k = e.id + '|' + co.id + '|' + draws; if (!T.cache.has(k)) T.cache.set(k, Q.assess(M.tokenOf(e), co, { draws })); return T.cache.get(k); }
  function exposures(e, draws) { return M.exposedCompanies(e).map(co => assess(e, co, draws || 2000)).filter(r => r.exposed).sort((a, b) => Math.abs(b.dist.median) - Math.abs(a.dist.median)); }
  const VRANK = { Act: 3, Prepare: 2, Monitor: 1, Ignore: 0 };
  function summary(e) { const xs = exposures(e); const top = xs[0] || null; const verdict = xs.reduce((a, r) => VRANK[r.decision.verdict] > VRANK[a] ? r.decision.verdict : a, 'Monitor'); return { xs, top, verdict, nAct: xs.filter(r => r.decision.verdict === 'Act').length, nHigh: xs.filter(r => r.materiality.tier === 'high').length }; }
  function meter(c) { const v = Math.round(c * 100); return `<div class="meter" role="img" aria-label="Confidence ${v} of 100"><div class="fill" style="width:${v}%;background:${confColor(c)}"></div><i style="left:65%"></i><i style="left:80%"></i></div>`; }
  const evidence = e => `${e.count} report${e.count === 1 ? '' : 's'} · ${e.nFacts} reported, ${e.count - e.nFacts} expected · ${e.index ? 'intensity index set by the event type' : 'move ' + (e.extracted ? 'extracted from ' + e.nExtracted + ' report' + (e.nExtracted === 1 ? '' : 's') : 'assumed, none stated in the reports')}`;
  const moveText = e => `${M.VARS[e.var].label} ${e.dir > 0 ? '+' : '−'}${M.fmtMag(e.mag, e.unit)}${e.level ? ' (' + e.level + ')' : ''}`;

  // ------------------------------------------------------------------ chrome
  function chrome() {
    $('#nav').innerHTML = [['overview', 'Overview'], ['events', 'Events'], ['companies', 'Companies'], ['engine', 'Engine']].map(([id, l]) => `<button type="button" class="${T.view === id ? 'active' : ''}" data-view="${id}">${l}</button>`).join('');
    $('#coverage').innerHTML = `<b>${META.reports.toLocaleString('en-IN')}</b> reports, Jagran business desk, ${fmtD(START)} to ${fmtD(END)}<br>${META.classified} reports classified into <b>${E.length}</b> events · latest report ${fmtD(END)} ${END.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`;
  }
  function filterBar(showWindow) {
    return `<div class="panel"><div class="filters">${showWindow ? `<select id="win" aria-label="Time window"><option value="all" ${T.window === 'all' ? 'selected' : ''}>Whole period</option><option value="180" ${T.window === '180' ? 'selected' : ''}>Last 180 days</option><option value="90" ${T.window === '90' ? 'selected' : ''}>Last 90 days</option><option value="30" ${T.window === '30' ? 'selected' : ''}>Last 30 days</option><option value="7" ${T.window === '7' ? 'selected' : ''}>Last 7 days</option></select>` : ''}
    ${INDS.map(i => `<button type="button" class="chip ${T.inds.has(i) ? 'on' : ''}" data-ind="${i}">${i}</button>`).join('')}<span class="dim">·</span>${CATS.map(c => `<button type="button" class="chip ${T.cats.has(c) ? 'on' : ''}" data-cat="${c}"><i style="background:${CCOL[c]}"></i>${c}</button>`).join('')}
    <input id="q" type="search" placeholder="Search events and reports" value="${esc(T.q)}" aria-label="Search" style="flex:1 1 200px;max-width:320px"></div></div>`;
  }

  // ------------------------------------------------------------------ overview
  function heatmap(list) {
    const counts = {}; let max = 1; CATS.forEach(c => INDS.forEach(i => { const n = list.filter(e => e.cats.includes(c) && e.inds.includes(i)).length; counts[c + '|' + i] = n; if (n > max) max = n; }));
    return `<div style="overflow-x:auto"><div class="heat" style="grid-template-columns: 150px repeat(${INDS.length}, minmax(76px, 1fr)); min-width: ${150 + INDS.length * 80}px"><div></div>${INDS.map(i => `<div class="hd">${i}</div>`).join('')}${CATS.map(c => `<div class="rh"><span class="dot" style="background:${CCOL[c]};margin-right:6px"></span>${c}</div>` + INDS.map(i => { const n = counts[c + '|' + i]; const a = n ? 0.12 + 0.75 * n / max : 0.04; return `<div class="cell" style="background:rgba(var(--seq),${a.toFixed(2)});color:${a > 0.55 ? '#fff' : 'var(--fg)'}" title="${c} in ${i}: ${n} events" data-cat="${c}" data-ind="${i}">${n || ''}</div>`; }).join('')).join('')}</div></div>`;
  }
  function timeline(list) {
    const weeks = []; const w0 = new Date(START); w0.setHours(0, 0, 0, 0); w0.setDate(w0.getDate() - w0.getDay());
    for (let d = new Date(w0); d <= END; d.setDate(d.getDate() + 7)) weeks.push(new Date(d));
    const idx = d => Math.min(weeks.length - 1, Math.floor((d - w0) / (7 * 86400000)));
    const stacks = weeks.map(() => Object.fromEntries(CATS.map(c => [c, 0]))); list.forEach(e => { stacks[idx(e.firstD)][e.primary]++; });
    const totals = stacks.map(s => CATS.reduce((a, c) => a + s[c], 0)); const maxT = Math.max(1, ...totals);
    const W = 1000, H = 190, pl = 28, pb = 26, pt = 8; const bw = (W - pl - 8) / weeks.length; const y = v => pt + (H - pt - pb) * (1 - v / maxT);
    let bars = ''; stacks.forEach((s, k) => { let acc = 0; CATS.forEach(c => { const v = s[c]; if (!v) return; const y1 = y(acc + v), y0 = y(acc); bars += `<rect x="${(pl + k * bw + 1).toFixed(1)}" y="${y1.toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${Math.max(0, y0 - y1 - 1).toFixed(1)}" rx="1.5" fill="${CCOL[c]}" data-w="${k}"></rect>`; acc += v; }); });
    const ticks = []; weeks.forEach((d, k) => { if (d.getDate() <= 7) ticks.push(`<text x="${(pl + k * bw).toFixed(1)}" y="${H - 8}">${d.toLocaleDateString('en-GB', { month: 'short' })}${d.getMonth() === 0 ? ' ' + d.getFullYear() : ''}</text>`); });
    const grid = [0, Math.ceil(maxT / 2), maxT].map(v => `<line x1="${pl}" x2="${W - 8}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"></line><text x="${pl - 6}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end">${v}</text>`).join('');
    const hit = weeks.map((d, k) => `<rect class="hit" x="${(pl + k * bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H}" fill="transparent" data-w="${k}"></rect>`).join('');
    T._weeks = weeks; T._stacks = stacks;
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Events per week by category" id="tl" style="max-width:100%;height:auto">${grid}${bars}${ticks.join('')}${hit}</svg><div class="legend">${CATS.map(c => `<span><span class="dot" style="background:${CCOL[c]}"></span>${c}</span>`).join('')}</div>`;
  }
  function overview() {
    const list = filtered(); const last30 = E.filter(e => e.lastD >= new Date(END.getTime() - 30 * 86400000));
    const act = last30.map(e => ({ e, s: summary(e) })).filter(x => x.s.verdict === 'Act').sort((a, b) => b.e.lastD - a.e.lastD);
    const tiles = [['Events tracked', list.length, `${CATS.length} categories across ${INDS.length} industries`], ['Reports behind them', new Set(list.flatMap(e => e.reports.map(r => r.sl))).size, `of ${META.reports.toLocaleString('en-IN')} on the desk`], ['Active in the last 30 days', last30.length, `latest ${fmtD(END)}`], ['Needing action now', act.length, 'events where a company verdict is Act'], ['Companies covered', M.COMPANIES.length, INDS.filter(i => M.COMPANIES.some(c => c.industry === i)).map(i => M.COMPANIES.filter(c => c.industry === i).length + ' ' + i.toLowerCase()).join(', ') + ' (other sectors are modelled on the owner page)']];
    const attention = act.slice(0, 8).map(({ e, s }) => `<button type="button" class="ev" data-open="${e.id}"><span class="stripe" style="background:${CCOL[e.primary]}"></span><span><span class="t">${esc(e.title)}</span><span class="m">${esc(s.top.co.name)} ${s.top.direction} ${fmt(s.top.band.lo)} to ${fmt(s.top.band.hi)} · ${s.nAct} compan${s.nAct === 1 ? 'y' : 'ies'} to act · ${e.count} report${e.count === 1 ? '' : 's'}</span></span><span class="r">${fmtDs(e.lastD)}</span></button>`).join('') || '<div class="empty">Nothing needs action in the last 30 days.</div>';
    return filterBar(true) + `<div class="grid cols-5">${tiles.map(t => `<div class="panel stat"><div class="l">${t[0]}</div><div class="v">${typeof t[1] === 'number' ? t[1].toLocaleString('en-IN') : t[1]}</div><div class="s">${t[2]}</div></div>`).join('')}</div>
    <div class="grid cols-2"><div class="panel"><h2>Events by category and industry</h2><p class="panel-desc">Counts in the selected window. An event can carry more than one category or industry.</p><div style="margin-top:12px;overflow-x:auto">${heatmap(list)}</div></div>
    <div class="panel"><h2>Events per week</h2><p class="panel-desc">Each event counted once, in the week of its first report, by its primary category.</p><div style="margin-top:12px">${timeline(list)}</div></div></div>
    <div class="panel"><div class="row between wrapf"><div><h2>Needing action in the last 30 days</h2><p class="panel-desc">Events where the engine's verdict for at least one company is Act: material, confident and within two quarters.</p></div><button type="button" class="chip" data-view="events">All events</button></div><div class="ev-list" style="margin-top:8px;max-height:none">${attention}</div></div>`;
  }

  // ------------------------------------------------------------------ events
  function evRow(e) { const s = summary(e); return `<button type="button" class="ev ${T.sel === e.id ? 'sel' : ''}" data-sel="${e.id}"><span class="stripe" style="background:${CCOL[e.primary]}"></span><span><span class="t">${esc(e.title)}</span><span class="m">${e.inds.join(', ')} · ${e.count} report${e.count === 1 ? '' : 's'}${e.extracted || e.index ? '' : ' · move assumed'}</span><span class="badges">${e.cats.map(c => `<span class="pill plain"><span class="dot" style="background:${CCOL[c]};width:7px;height:7px;margin-right:4px"></span>${c}</span>`).join('')}${s.top ? `<span class="pill ${s.verdict}">${s.verdict}</span>` : '<span class="pill plain">Watch</span>'}</span></span><span class="r">${fmtDs(e.firstD)}${e.firstD.toDateString() === e.lastD.toDateString() ? '' : ' to ' + fmtDs(e.lastD)}</span></button>`; }

  function companyDetail(r) {

    return `<div class="panel" style="margin-top:10px;background:var(--surface-2)"><div class="row between wrapf"><h3 style="font-size:14px">${esc(r.co.name)}: ${esc(r.co.sector)}</h3><span class="pill ${r.decision.verdict}">${r.decision.verdict}</span></div>
      <div class="mrow" style="margin-top:8px">${meter(r.confidence.calibrated)}<span>Direction confidence <b>${Math.round(r.confidence.calibrated * 100)}/100</b> <span class="dim">calibrated · size reliability ${r.confidence.sizeGrade}</span></span></div>
      <dl class="kv" style="margin-top:8px"><dt>Base case</dt><dd class="mono ${sgn(r.band.lo)}">${fmt(r.band.lo)} to ${fmt(r.band.hi)} of EBITDA, ${pct(r.band.pBase)} likely, ${esc(r.ev.horizonText)}</dd><dt>Probability-weighted</dt><dd class="mono">${fmt(r.expected)}</dd><dt>Materiality</dt><dd>${r.materiality.tier}: P(|impact| ≥ 1%) = ${pct(r.materiality.pGe1)}</dd><dt>Elasticity</dt><dd>${r.primary.beta} per ${r.primary.move.unit === 'bps' ? '100 bps' : '1 ' + r.primary.move.unit} ± ${Math.round(r.primary.sigmaC * 100)}% <span class="dim">(${esc(r.primary.source)}: ${esc(r.primary.basis)})</span></dd></dl>
      <h3 style="font-size:13px;margin-top:10px">Transmission</h3>${chans}<h3 style="font-size:13px;margin-top:10px">Scenarios</h3>${scen}<h3 style="font-size:13px;margin-top:10px">Levers, priced in EBITDA</h3>${levers}<p class="note" style="margin-top:8px"><b>${r.decision.verdict}.</b> ${esc(r.decision.reason)}</p>
      <details><summary>How the engine got here</summary><ol class="steps">${r.trace.map(t => `<li><b>${esc(t.step)}.</b> ${esc(t.text)}</li>`).join('')}</ol></details></div>`;
  }
  function detail(e) {
    if (!e) return '<div class="panel"><div class="empty">Select an event.</div></div>';
    const xs = exposures(e, 8000); const tok = M.tokenOf(e); const ver = Q.verify(tok);
    const reps = e.reports.slice().reverse().map(r => `<div class="rep"><span class="d">${fmtD(d2(r.date))}<br>${esc(r.type)}</span><span>${esc(r.headline)}<small>${r.mt ? 'Machine-translated · ' : ''}${r.outlook ? 'Expectation' : 'Reported'}${r.mag != null ? ' · states ' + M.fmtMag(r.mag, e.unit) : ''}${r.level ? ' · ' + esc(r.level) : ''}</small></span></div>`).join('');
    const open = T.coOpen && xs.find(r => r.co.id === T.coOpen);
    return `<div class="panel"><div class="tags">${CATS.map(c => `<span class="tag ${e.cats.includes(c) ? 'on' : ''}">${e.cats.includes(c) ? `<span class="dot" style="background:${CCOL[c]};margin-right:5px;width:7px;height:7px"></span>` : ''}${c}</span>`).join('')}</div>
      <h2 style="font-size:19px;margin-top:10px">${esc(e.title)}</h2><p class="muted" style="margin-top:4px">${esc(e.rep)}</p>
      <dl class="kv" style="margin-top:12px"><dt>When</dt><dd>${fmtD(e.firstD)}${e.firstD.toDateString() === e.lastD.toDateString() ? '' : ' to ' + fmtD(e.lastD)}</dd><dt>Move</dt><dd>${esc(moveText(e))}${e.extracted || e.index ? '' : ' <span class="dim">(assumed from the event type; no figure stated in the reports)</span>'}</dd><dt>Industries</dt><dd>${e.inds.join(', ')}</dd><dt>Evidence</dt><dd>${esc(evidence(e))}</dd></dl>
      <div class="mrow" style="margin-top:10px">${meter(ver.sourceConfidence)}<span>Source confidence <b>${Math.round(ver.sourceConfidence * 100)}/100</b> <span class="dim">${ver.facts} corroborating report${ver.facts === 1 ? '' : 's'}</span></span></div></div>
      <div class="panel"><h2>Companies affected</h2><p class="panel-desc">Base-case EBITDA band from the quant engine; select a company for the transmission, scenarios and levers.</p>${xs.length ? `<div style="overflow-x:auto;margin-top:8px"><table class="tbl"><tr><th>Company</th><th>Direction</th><th>Materiality</th><th class="n">Base case</th><th class="n">Confidence</th><th>Verdict</th></tr>${xs.map(companyRow).join('')}</table></div>` : '<p class="dim" style="margin-top:8px">No company record has a line that moves with this event. It stays on watch; owners in the affected sectors see it modelled on their own profile.</p>'}${open ? companyDetail(open) : ''}</div>
      <div class="panel"><h2>Reports</h2><p class="panel-desc">Every report behind this event, latest first.</p><div class="reports" style="margin-top:8px">${reps}</div></div>`;
  }
  function events() {
    const list = filtered().sort((a, b) => b.lastD - a.lastD); if (!T.sel || !list.some(e => e.id === T.sel)) T.sel = list.length ? list[0].id : null;
    return filterBar(true) + `<div class="grid md"><div class="panel" style="padding:8px"><div class="dim" style="padding:6px 8px">${list.length} event${list.length === 1 ? '' : 's'}, latest first</div><div class="ev-list" id="evlist">${list.map(evRow).join('') || '<div class="empty">No events match.</div>'}</div></div><div id="detail" style="display:flex;flex-direction:column;gap:14px;min-width:0">${detail(E.find(e => e.id === T.sel))}</div></div>`;
  }

  // ------------------------------------------------------------------ companies
  function companies() {
    const co = M.companyById(T.co); const list = filtered().sort((a, b) => b.lastD - a.lastD);
    const rows = list.filter(e => co.channels.some(h => h.variable === e.var)).map(e => ({ e, r: assess(e, co, 3000) })).filter(x => x.r.exposed);
    const grid = `<div class="co-grid">${M.COMPANIES.map(c => `<button type="button" class="co ${c.id === T.co ? 'on' : ''}" data-pick="${c.id}"><b>${esc(c.name)}</b><span>${esc(c.industry)} · ${esc(c.sector)}</span></button>`).join('')}</div>`;
    const chans = `<table class="tbl"><tr><th>Line</th><th>Moves with</th><th class="n">Share</th><th class="n">Pass-through</th><th class="n">Hedge</th><th>Basis</th></tr>${co.channels.map(h => `<tr><td>${esc(h.name)}</td><td>${esc(M.VARS[h.variable].label)}</td><td class="n">${pct(h.share)}</td><td class="n">${pct(h.passThrough)}</td><td class="n">${pct(h.hedge)}</td><td class="dim">${esc(h.basis)}</td></tr>`).join('')}</table>`;
    const tbl = rows.length ? `<table class="tbl"><tr><th>Event</th><th>When</th><th>Direction</th><th>Materiality</th><th class="n">Base case</th><th class="n">Confidence</th><th>Verdict</th></tr>${rows.map(({ e, r }) => `<tr class="click" data-open="${e.id}"><td><b>${esc(e.title)}</b><br><span class="dim">${e.count} report${e.count === 1 ? '' : 's'}</span></td><td class="mono" style="white-space:nowrap">${fmtDs(e.lastD)}</td><td><span class="pill ${r.direction}">${r.direction}</span></td><td><span class="pill ${r.materiality.tier}">${r.materiality.tier}</span></td><td class="n ${sgn(r.band.lo)}">${fmt(r.band.lo)} to ${fmt(r.band.hi)}</td><td class="n">${Math.round(r.confidence.calibrated * 100)}</td><td><span class="pill ${r.decision.verdict}">${r.decision.verdict}</span></td></tr>`).join('')}</table>` : '<div class="empty">No event in this window touches this company.</div>';
    const nAct = rows.filter(x => x.r.decision.verdict === 'Act').length, nAdv = rows.filter(x => x.r.direction === 'adverse').length;
    return filterBar(true) + `<div class="panel"><h2>Company</h2><p class="panel-desc">Choose a company to see every event that reaches one of its lines.</p><div style="margin-top:10px">${grid}</div></div>
      <div class="panel"><div class="row between wrapf"><div><h2>${esc(co.name)}</h2><p class="panel-desc">${esc(co.desc)} Record as of ${esc(co.asOf)}, EBITDA margin ${pct(co.margin)}.</p></div><div class="row"><span class="pill plain">${rows.length} events</span><span class="pill adverse">${nAdv} adverse</span><span class="pill supportive">${rows.length - nAdv} supportive</span><span class="pill Act">${nAct} to act</span></div></div><div style="overflow-x:auto;margin-top:10px">${tbl}</div></div>
      <div class="panel"><h2>What moves ${esc(co.name)}</h2><p class="panel-desc">The lines in the company record and the variable each one follows.</p><div style="overflow-x:auto;margin-top:8px">${chans}</div></div>`;
  }

  // ------------------------------------------------------------------ engine
  function engine() {
    const ev = Q.evaluate(); const props = Q.propertyTests();
    const stats = [['Ledger calls', ev.n], ['Direction hit rate', pct(ev.hitRate)], ['Brier, raw → calibrated', `${ev.brierRaw} → ${ev.brierCal}`], ['ECE, raw → calibrated', `${ev.eceRaw} → ${ev.eceCal}`], ['Size within 0.5x to 2x', pct(ev.sizeWithin2x)]];
    const rel = `<div class="rel">${ev.bins.map(b => `<div class="bar" title="${b.lo}-${b.hi}: n=${b.n}, confidence ${b.conf ?? '-'}, hit ${b.hit ?? '-'}"><div style="height:${b.hit != null ? Math.round(b.hit * 100) : 0}%"></div>${b.conf != null ? `<i style="bottom:${Math.round(b.conf * 100)}%"></i>` : ''}</div>`).join('')}</div><div class="rel-x">${ev.bins.map(b => `<span>${b.lo.toFixed(1)}</span>`).join('')}</div>`;
    const method = ['Reports are classified by a weighted lexicon into the seven categories and fifteen sectors; a report must describe a change, not a topic.', 'Reports on the same variable, sub-topic and direction with no gap longer than four days form one event; the count of reports is the corroboration signal.', 'The move is extracted from the text (percent, basis points, rupees per litre, paise); when no figure is stated, the event type’s typical move is used and the dispersion widened, and the dashboard says so.', 'Each company record lists the lines that move with a variable: share of revenue, elasticity with its uncertainty, pass-through, reset lag, hedge, substitution and the basis for each number.', 'The engine draws the shock and the elasticity as lognormals, runs 8000 antithetic Monte Carlo draws through the transmission, and reports the central band as the base case with upside and downside tails.', 'Materiality is the probability that the EBITDA effect clears 1% (high) or 0.4% (medium).', 'Direction confidence combines source verification, precedent hit rate, sign agreement, record quality and magnitude clarity, then passes through logistic calibration fitted on the backtest ledger. Size reliability is graded separately.', 'Levers re-run the simulation with one change each and are priced against their cost; the verdict is Act, Prepare, Monitor or Ignore.'];
    return `<div class="grid cols-5">${stats.map(s => `<div class="panel stat"><div class="l">${s[0]}</div><div class="v" style="font-size:20px">${esc(String(s[1]))}</div></div>`).join('')}</div>
      <div class="grid cols-2"><div class="panel"><h2>Reliability diagram</h2><p class="panel-desc">Bar: realised direction hit rate per raw-score bin. Line: mean stated confidence. Bars below the line are overconfident bins; calibration corrects them.</p>${rel}<p class="note" style="margin-top:8px">${esc(ev.note)}</p></div>
      <div class="panel"><h2>Invariants</h2><p class="panel-desc">Checks the engine runs on itself at load.</p><table class="tbl" style="margin-top:6px">${props.map(p => `<tr><td>${esc(p.name)}<br><span class="dim">${esc(p.detail)}</span></td><td class="${p.ok ? 'pos' : 'neg'}" style="font-weight:600">${p.ok ? 'Pass' : 'Fail'}</td></tr>`).join('')}</table></div></div>
      <div class="panel"><h2>Method</h2><ol class="steps">${method.map(m => `<li>${esc(m)}</li>`).join('')}</ol><p class="dim" style="margin-top:8px">Engine v${Q.version}. Company records carry an as-of date; elasticities marked estimated come from filings, those marked disclosed from the company’s own sensitivity tables.</p></div>`;
  }

  // ------------------------------------------------------------------ render and events
  const VIEWS = { overview, events, companies, engine };
  function render() { chrome(); $('#view').innerHTML = VIEWS[T.view](); }
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-view],[data-ind],[data-cat],[data-sel],[data-open],[data-co],[data-pick]'); if (!t) return;
    if (t.dataset.view) { T.view = t.dataset.view; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.ind !== undefined && t.classList.contains('chip')) { T.inds.has(t.dataset.ind) ? T.inds.delete(t.dataset.ind) : T.inds.add(t.dataset.ind); render(); return; }
    if (t.dataset.cat !== undefined && t.classList.contains('chip')) { T.cats.has(t.dataset.cat) ? T.cats.delete(t.dataset.cat) : T.cats.add(t.dataset.cat); render(); return; }
    if (t.dataset.cat !== undefined && t.classList.contains('cell')) { T.cats = new Set([t.dataset.cat]); T.inds = new Set([t.dataset.ind]); T.view = 'events'; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.sel) { T.sel = t.dataset.sel; T.coOpen = null; document.querySelectorAll('.ev').forEach(el => el.classList.toggle('sel', el.dataset.sel === T.sel)); $('#detail').innerHTML = detail(E.find(x => x.id === T.sel)); if (window.innerWidth < 1100) $('#detail').scrollIntoView({ block: 'start', behavior: 'smooth' }); return; }
    if (t.dataset.open) { T.sel = t.dataset.open; T.coOpen = null; T.view = 'events'; T.window = 'all'; T.inds.clear(); T.cats.clear(); T.q = ''; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.co) { T.coOpen = T.coOpen === t.dataset.co ? null : t.dataset.co; $('#detail').innerHTML = detail(E.find(x => x.id === T.sel)); return; }
    if (t.dataset.pick) { T.co = t.dataset.pick; render(); return; }
  });
  document.addEventListener('change', e => { if (e.target.id === 'win') { T.window = e.target.value; render(); } });
  let qt; document.addEventListener('input', e => { if (e.target.id === 'q') { clearTimeout(qt); const v = e.target.value; qt = setTimeout(() => { T.q = v; const pos = e.target.selectionStart; render(); const q = $('#q'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }, 250); } });
  document.addEventListener('mousemove', e => { const r = e.target.closest && e.target.closest('#tl rect[data-w]'); const tip = $('#tip'); if (!r) { tip.hidden = true; return; } const k = Number(r.dataset.w); const d = T._weeks[k], s = T._stacks[k]; const parts = CATS.filter(c => s[c]).map(c => `${c}: ${s[c]}`); tip.innerHTML = `<b>Week of ${fmtD(d)}</b><br>${parts.length ? parts.join('<br>') : 'No events'}`; tip.hidden = false; tip.style.left = Math.min(window.innerWidth - 270, e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; });
  render();
  // warm the summary cache in the background so the Events view opens without a pause
  let wi = 0; const warm = () => { const t0 = Date.now(); while (wi < E.length && Date.now() - t0 < 40) summary(E[wi++]); if (wi < E.length) setTimeout(warm, 30); }; setTimeout(warm, 300);
})();
});
</script>

</body>
</html>
